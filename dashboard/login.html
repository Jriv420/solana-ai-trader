<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151719"><title>Nexus · Sign in</title><style>body{margin:0;background:#151719;color:#f2f4f3;font:16px system-ui;min-height:100svh;display:grid;place-items:center}main{width:min(360px,85vw);padding:30px 0}h1{letter-spacing:.1em}p{color:#acb3af;line-height:1.5}input,button{box-sizing:border-box;width:100%;font:inherit;border-radius:8px;padding:14px;margin:12px 0}input{background:#202422;border:1px solid #4a514d;color:white}button{background:#a8d5b9;border:0;color:#15221b;font-weight:600}label{display:block}.error{color:#ffaaaa}</style></head><body><main><h1>NEXUS</h1><p>Sign in to your paper-trading dashboard using your existing dashboard password.</p><form method="post" action="/login"><label for="password">Dashboard password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button>Sign in</button></form><p id="error" class="error" role="status"></p><script>const message=new URLSearchParams(location.search).get('error');document.getElementById('error').textContent=message==='password'?'Password incorrect. Try again.':message==='rate'?'Too many attempts. Wait a minute and try again.':'';</script></main></body></html>
